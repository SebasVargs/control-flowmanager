    <div class="flex justify-between items-center h-auto pt-4 pb-4">
      <!-- Logo -->
      <div>
        <a routerLink="." class="main-img flex flex-row text-2xl font-bold text-gray-800">
          <img class="w-16" src="assets/images/fecha-del-calendario.png" alt="">
          <span class="flex items-center ml-10 text-2xl"></span>
        </a>
      </div>
      <!-- Navigation Links -->
      <div class="space-x-6 text-base">
      </div>

      <div class="mr-24">
        <div class="main-03 inline-block text-left">
          <!-- Botón que abrirá el dropdown -->
          <button type="button"
            class="inline-flex justify-start rounded-md border border-gray-100 dark:placeholder-gray-600 dark:border-gray-800 py-2 px-3 text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"

              <path stroke-linecap="round" stroke-linejoin="round"

              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
          </button>

          <!-- Contenedor del menú que será mostrado/ocultado -->
          <div *ngIf="configOpen" appClickOutside (clickOutside)="configDropdown()"
            class="mr-28 absolute right-0 mt-2 w-32 origin-top-right rounded-md bg-white text-sm shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none">
            <div *ngFor="let config of configItems"
              class="py-1 flex flex-row justify-between p-4 mt-3 mb-3 cursor-pointer">

              <button *ngIf="config.icon === 'logout'; else menuLink" (click)="openLogoutModal()"
                title="{{ config.label }}" class="flex flex-row">
                <svg class="h-6 w-6 mr-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="config.svgPath" />
                </svg>
                <span *ngIf="configOpen">{{ config.label }}</span>
              </button>

              <ng-template #menuLink>
                <a [routerLink]="[config.route]" title="{{ config.label }}" class="flex flex-row justify-between">
                  <svg class="h-6 w-6 mr-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="config.svgPath" />
                  </svg>
                  <span *ngIf="configOpen">{{ config.label }}</span>
                </a>
              </ng-template>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<div class="mb-28">

</div>

<section class="ml-6 z-10">
  <div class="flex justify-between mr-6">
    <span class="text-slate-500">Schedule / {{ currentRoute }}</span>
    <div class="navbar-second flex flex-row">

      <a routerLink="."
        class="ml-2 cursor-pointer text-slate-800 flex items-center rounded-lg p-1 pr-4 pl-4 hover:bg-slate-200 border border-gray-100 dark:placeholder-gray-600 dark:border-gray-800">
        <span>Info</span>
      </a>
      <a routerLink="."
        class="ml-2 cursor-pointer text-slate-800 flex items-center rounded-lg p-1 pr-4 pl-4 hover:bg-slate-200 border border-gray-100 dark:placeholder-gray-600 dark:border-gray-800">
        <span>Status</span>
      </a>
      <a routerLink="./habilities"
        class="ml-2 cursor-pointer bg-my-color-3 text-slate-50 flex items-center rounded-lg p-1 pr-4 pl-4 hover:bg-my-color-2 hover:scale-105 border border-gray-100 dark:placeholder-gray-600 dark:border-gray-800">
        <span>Habilities</span>
      </a>
      <a routerLink="./courses"
        class="ml-2 cursor-pointer bg-my-color-3 text-slate-50 flex items-center rounded-lg p-1 pr-4 pl-4 hover:bg-my-color-2 hover:scale-105 border border-gray-100 dark:placeholder-gray-600 dark:border-gray-800">
        <span>Courses / Topics</span>
      </a>
    </div>
  </div>
  <h1 class="title-main flex text-3xl mb-4">Schedule Development</h1>

  <div class="content-main flex flex-row w-full">

    <div class="overflow-x-auto">
      <table class="table-auto border-collapse border border-gray-300 w-full text-sm">
        <!-- Encabezado de la tabla -->
        <thead>
          <tr class="bg-gray-200">
            <th class="border border-gray-300 px-4 py-2">Hora</th>
            <th *ngFor="let day of days" class="border border-gray-300 px-4 py-2">{{ day }}</th>
          </tr>
        </thead>
        <!-- Cuerpo de la tabla -->
        <tbody>
          <tr *ngFor="let hour of hours" class="hover:bg-gray-100">
            <td class="border border-gray-300 px-4 py-2 text-center">{{ hour }}</td>
            <td *ngFor="let day of days" class="border border-gray-300 px-4 py-2"></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="content-main-02 flex flex-col ml-10">
      <div>
        <router-outlet></router-outlet>
      </div>
    </div>

  </div>

</section>

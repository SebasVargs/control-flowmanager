<h1 class="title-main flex text-3xl mb-4">Schedule Development</h1>
<div class="overflow-x-auto">
  <table class="table-auto border-collapse border border-gray-300 w-full text-sm">
    <!-- Encabezado de la tabla -->
    <thead>
      <tr class="bg-gray-200">
        <th class="border border-gray-300 px-4 py-2">Hora</th>
        <th *ngFor="let day of days" class="border border-gray-300 px-4 py-2">{{ day.name }}</th>
      </tr>
    </thead>
    <!-- Cuerpo de la tabla -->
    <tbody>
      <tr *ngFor="let hour of hours" class="hover:bg-gray-100">
        <td class="border border-gray-300 px-4 py-2 text-center">{{ hour }}</td>
        <td *ngFor="let day of days" class="border border-gray-300 px-4 py-2">
          <!-- Mostrar eventos -->
           <div *ngIf="calendar[day.name] && calendar[day.name][hour]">
            <div *ngFor="let event of calendar[day.name][hour]" class="bg-blue-50 rounded p-2 mb-1">
              <p class="font-semibold">{{ event.course }}</p>
              <p class="text-xs text-gray-600">Duración: {{ event.duration }} min</p>
              <p class="text-xs text-gray-600">Recurrente: {{ event.recurrent ? 'Sí' : 'No' }}</p>
            </div>
           </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
